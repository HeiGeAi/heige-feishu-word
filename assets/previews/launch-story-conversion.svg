<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Noto Sans SC, sans-serif"><rect x="0" y="0" width="1600" height="900" fill="#0e0c14"/><rect x="0" y="0" width="1600" height="14" fill="#ff2d95"/><polygon points="1460,40 1530,40 1530,110" fill="#ffe500"/><circle cx="1425" cy="53" r="13" fill="#ff2d95"/><text x="96" y="82" font-size="25" font-weight="700" fill="#ff2d95" text-anchor="start"><tspan x="96" dy="0">阶段转化</tspan></text><text x="70" y="154" font-size="50" font-weight="700" fill="#f7f4ec" text-anchor="start"><tspan x="70" dy="0">从触达到有效试用</tspan></text><line x1="70" y1="185" x2="1530" y2="185" stroke="#2e2b3c" stroke-width="2"/><rect x="70" y="751" width="8" height="77" fill="#ffe500"/><text x="99" y="777" font-size="25" font-weight="700" fill="#ff2d95" text-anchor="start"><tspan x="99" dy="0">关键洞察</tspan></text><text x="252" y="777" font-size="28" font-weight="400" fill="#f7f4ec" text-anchor="start"><tspan x="252" dy="0">访问到注册转化为 25%，注册到有效试用为 30%；优先验证后者能否通过引导改进，当前漏斗不能</tspan><tspan x="252" dy="36">解释流失原因。</tspan></text><line x1="70" y1="842" x2="1530" y2="842" stroke="#2e2b3c" stroke-width="2"/><text x="70" y="879" font-size="25" font-weight="400" fill="#ada8bc" text-anchor="start"><tspan x="70" dy="0">数据来源</tspan></text><text x="202" y="879" font-size="25" font-weight="400" fill="#ada8bc" text-anchor="start"><tspan x="202" dy="0">合成演示活动追踪表；同一追踪批次，后一阶段用户均属于前一阶段，窗口为活动开始后 7 天</tspan></text><text x="70" y="222" font-size="26" font-weight="700" fill="#f7f4ec" text-anchor="start"><tspan x="70" dy="0">去重用户数</tspan></text><text x="1530" y="222" font-size="25" font-weight="400" fill="#ada8bc" text-anchor="end"><tspan x="1530" dy="0">单位：人</tspan></text><polygon points="500,250 1090,250 889.4,356.5 700.6,356.5" fill="#ff2d95"/><text x="70" y="312.25" font-size="28" font-weight="400" fill="#f7f4ec" text-anchor="start"><tspan x="70" dy="0">可追踪触达</tspan></text><text x="1510" y="312.25" font-size="27" font-weight="700" fill="#f7f4ec" text-anchor="end"><tspan x="1510" dy="0">10000</tspan></text><polygon points="700.6,363.5 889.4,363.5 818.6,470 771.4,470" fill="#ffe500"/><text x="70" y="425.75" font-size="28" font-weight="400" fill="#f7f4ec" text-anchor="start"><tspan x="70" dy="0">活动页访问</tspan></text><text x="1510" y="425.75" font-size="27" font-weight="700" fill="#f7f4ec" text-anchor="end"><tspan x="1510" dy="0">3200</tspan></text><polygon points="771.4,477 818.6,477 802.08,583.5 787.92,583.5" fill="#91acff"/><text x="70" y="539.25" font-size="28" font-weight="400" fill="#f7f4ec" text-anchor="start"><tspan x="70" dy="0">活动注册</tspan></text><text x="1510" y="539.25" font-size="27" font-weight="700" fill="#f7f4ec" text-anchor="end"><tspan x="1510" dy="0">800</tspan></text><polygon points="787.92,590.5 802.08,590.5 802.08,697 787.92,697" fill="#f7f4ec"/><text x="70" y="652.75" font-size="28" font-weight="400" fill="#f7f4ec" text-anchor="start"><tspan x="70" dy="0">有效试用</tspan></text><text x="1510" y="652.75" font-size="27" font-weight="700" fill="#f7f4ec" text-anchor="end"><tspan x="1510" dy="0">240</tspan></text></svg>
