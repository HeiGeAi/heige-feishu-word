<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" fill="#0e0c14"/><rect x="80" y="70" width="330" height="44" fill="#2e2b3c" stroke="#f7f4ec" stroke-width="2"/><text x="245" y="99" text-anchor="middle" font-size="18" font-weight="700" fill="#f7f4ec">WORKFLOW</text><text x="80" y="183" font-size="54" font-weight="700" fill="#f7f4ec">让发布体验接得上使用</text><rect x="1130" y="96" width="370" height="64" fill="#1b1826" stroke="#f7f4ec" stroke-width="2"/><text x="1315" y="136" text-anchor="middle" font-size="22" font-weight="700" fill="#f7f4ec">可编辑 · 可追溯 · 可验证</text><line x1="80" y1="214" x2="1500" y2="214" stroke="#f7f4ec" stroke-width="3"/><rect x="80" y="250" width="430" height="210" fill="#1b1826" stroke="#f7f4ec" stroke-width="3"/><rect x="104" y="274" width="72" height="58" fill="#2e2b3c" stroke="#f7f4ec" stroke-width="2"/><text x="140" y="313" text-anchor="middle" font-size="25" font-weight="700" fill="#f7f4ec">01</text><text x="198" y="312" font-size="27" font-weight="700" fill="#f7f4ec">真实任务开场</text><line x1="104" y1="350" x2="486" y2="350" stroke="#f7f4ec" stroke-width="2"/><text x="104" y="387" font-size="21" font-weight="400" fill="#f7f4ec"><tspan x="104" dy="0">先呈现一个明确的信息协作难题。</tspan></text><rect x="570" y="250" width="430" height="210" fill="#1b1826" stroke="#f7f4ec" stroke-width="3"/><rect x="594" y="274" width="72" height="58" fill="#2e2b3c" stroke="#f7f4ec" stroke-width="2"/><text x="630" y="313" text-anchor="middle" font-size="25" font-weight="700" fill="#f7f4ec">02</text><text x="688" y="312" font-size="27" font-weight="700" fill="#f7f4ec">完成流程演示</text><line x1="594" y1="350" x2="976" y2="350" stroke="#f7f4ec" stroke-width="2"/><text x="594" y="387" font-size="21" font-weight="400" fill="#f7f4ec"><tspan x="594" dy="0">展示问题、操作、结果与核对方式。</tspan></text><rect x="1060" y="250" width="430" height="210" fill="#1b1826" stroke="#f7f4ec" stroke-width="3"/><rect x="1084" y="274" width="72" height="58" fill="#2e2b3c" stroke="#f7f4ec" stroke-width="2"/><text x="1120" y="313" text-anchor="middle" font-size="25" font-weight="700" fill="#f7f4ec">03</text><text x="1178" y="312" font-size="27" font-weight="700" fill="#f7f4ec">复制入门任务</text><line x1="1084" y1="350" x2="1466" y2="350" stroke="#f7f4ec" stroke-width="2"/><text x="1084" y="387" font-size="21" font-weight="400" fill="#f7f4ec"><tspan x="1084" dy="0">让观众注册后立即尝试相同流程。</tspan></text><rect x="1060" y="525" width="430" height="210" fill="#1b1826" stroke="#f7f4ec" stroke-width="3"/><rect x="1084" y="549" width="72" height="58" fill="#2e2b3c" stroke="#f7f4ec" stroke-width="2"/><text x="1120" y="588" text-anchor="middle" font-size="25" font-weight="700" fill="#f7f4ec">04</text><text x="1178" y="587" font-size="27" font-weight="700" fill="#f7f4ec">收集试用反馈</text><line x1="1084" y1="625" x2="1466" y2="625" stroke="#f7f4ec" stroke-width="2"/><text x="1084" y="662" font-size="21" font-weight="400" fill="#f7f4ec"><tspan x="1084" dy="0">记录完成情况和卡点，形成后续改进。</tspan></text><line x1="518" y1="355" x2="562" y2="355" stroke="#f7f4ec" stroke-width="5"/><line x1="1008" y1="355" x2="1052" y2="355" stroke="#f7f4ec" stroke-width="5"/><line x1="1275" y1="468" x2="1275" y2="517" stroke="#f7f4ec" stroke-width="5"/><line x1="80" y1="798" x2="1500" y2="798" stroke="#f7f4ec" stroke-width="2"/><text x="80" y="845" font-size="20" fill="#f7f4ec">按编号阅读流程，详细说明见正文。</text><text x="1500" y="845" text-anchor="end" font-size="20" font-weight="700" fill="#f7f4ec">HEIGE FEISHU WORD</text></svg>
