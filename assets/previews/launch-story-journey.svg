<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="240" viewBox="0 0 1600 240" font-family="Noto Sans SC, sans-serif"><rect x="0" y="0" width="1600" height="240" fill="#FFFFFF"/><g id="workflow-step-1"><rect x="40" y="12" width="362" height="168" fill="#FFE5F1"/><rect x="106" y="22" width="64" height="3" fill="#B81769"/><circle cx="68" cy="48" r="20" fill="#FFFFFF" stroke="#B81769" stroke-width="2"/><text x="68" y="57" text-anchor="middle" font-size="26" font-weight="600" fill="#B81769">1</text><text x="106.0" y="58" font-size="32" font-weight="600" fill="#202B3D"><tspan x="106.0" dy="0">真实任务开场</tspan></text><text x="48.0" y="112" font-size="28" font-weight="400" fill="#202B3D"><tspan x="48.0" dy="0">先呈现一个明确的信息协</tspan><tspan x="48.0" dy="36">作难题。</tspan></text></g><line x1="404" y1="48" x2="422" y2="48" stroke="#B81769" stroke-width="2"/><polyline points="416,42 422,48 416,54" fill="none" stroke="#B81769" stroke-width="2"/><g id="workflow-step-2"><rect x="426" y="12" width="362" height="168" fill="#FFEDA0"/><rect x="492" y="22" width="64" height="3" fill="#855D00"/><circle cx="454" cy="48" r="20" fill="#FFFFFF" stroke="#855D00" stroke-width="2"/><text x="454" y="57" text-anchor="middle" font-size="26" font-weight="600" fill="#855D00">2</text><text x="492.0" y="58" font-size="32" font-weight="600" fill="#202B3D"><tspan x="492.0" dy="0">完成流程演示</tspan></text><text x="434.0" y="112" font-size="28" font-weight="400" fill="#202B3D"><tspan x="434.0" dy="0">展示问题、操作、结果与核</tspan><tspan x="434.0" dy="36">对方式。</tspan></text></g><line x1="790" y1="48" x2="808" y2="48" stroke="#855D00" stroke-width="2"/><polyline points="802,42 808,48 802,54" fill="none" stroke="#855D00" stroke-width="2"/><g id="workflow-step-3"><rect x="812" y="12" width="362" height="168" fill="#E8EDFF"/><rect x="878" y="22" width="64" height="3" fill="#3452C4"/><circle cx="840" cy="48" r="20" fill="#FFFFFF" stroke="#3452C4" stroke-width="2"/><text x="840" y="57" text-anchor="middle" font-size="26" font-weight="600" fill="#3452C4">3</text><text x="878.0" y="58" font-size="32" font-weight="600" fill="#202B3D"><tspan x="878.0" dy="0">复制入门任务</tspan></text><text x="820.0" y="112" font-size="28" font-weight="400" fill="#202B3D"><tspan x="820.0" dy="0">让观众注册后立即尝试相</tspan><tspan x="820.0" dy="36">同流程。</tspan></text></g><line x1="1176" y1="48" x2="1194" y2="48" stroke="#3452C4" stroke-width="2"/><polyline points="1188,42 1194,48 1188,54" fill="none" stroke="#3452C4" stroke-width="2"/><g id="workflow-step-4"><rect x="1198" y="12" width="362" height="168" fill="#DFF5EC"/><rect x="1264" y="22" width="64" height="3" fill="#08756A"/><circle cx="1226" cy="48" r="20" fill="#FFFFFF" stroke="#08756A" stroke-width="2"/><text x="1226" y="57" text-anchor="middle" font-size="26" font-weight="600" fill="#08756A">4</text><text x="1264.0" y="58" font-size="32" font-weight="600" fill="#202B3D"><tspan x="1264.0" dy="0">收集试用反馈</tspan></text><text x="1206.0" y="112" font-size="28" font-weight="400" fill="#202B3D"><tspan x="1206.0" dy="0">记录完成情况和卡点，形成</tspan><tspan x="1206.0" dy="36">后续改进。</tspan></text></g></svg>
