<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Noto Sans SC, sans-serif"><rect x="0" y="0" width="1600" height="900" fill="#f4f5f7"/><line x1="70" y1="42" x2="1530" y2="42" stroke="#2757d6" stroke-width="7"/><line x1="70" y1="57" x2="1530" y2="57" stroke="#2757d6" stroke-width="2"/><text x="96" y="82" font-size="25" font-weight="700" fill="#2757d6" text-anchor="start"><tspan x="96" dy="0">横向对比</tspan></text><text x="70" y="154" font-size="50" font-weight="700" fill="#1a1d24" text-anchor="start"><tspan x="70" dy="0">自然搜索贡献最多</tspan></text><line x1="70" y1="185" x2="1530" y2="185" stroke="#d5d8dd" stroke-width="2"/><rect x="70" y="751" width="8" height="77" fill="#14171d"/><text x="99" y="777" font-size="25" font-weight="700" fill="#2757d6" text-anchor="start"><tspan x="99" dy="0">关键洞察</tspan></text><text x="252" y="777" font-size="28" font-weight="400" fill="#1a1d24" text-anchor="start"><tspan x="252" dy="0">自然搜索贡献 44 万元，付费投放贡献 22 万元；收入贡献不能直接等同于渠道利润或获客效率。</tspan></text><line x1="70" y1="842" x2="1530" y2="842" stroke="#d5d8dd" stroke-width="2"/><text x="70" y="879" font-size="25" font-weight="400" fill="#5b6270" text-anchor="start"><tspan x="70" dy="0">数据来源</tspan></text><text x="202" y="879" font-size="25" font-weight="400" fill="#5b6270" text-anchor="start"><tspan x="202" dy="0">合成演示 6 月渠道表；按首次有效来源唯一归因，四项合计 132 万元</tspan></text><text x="70" y="222" font-size="26" font-weight="700" fill="#1a1d24" text-anchor="start"><tspan x="70" dy="0">6 月收入</tspan></text><text x="1530" y="222" font-size="25" font-weight="400" fill="#5b6270" text-anchor="end"><tspan x="1530" dy="0">单位：万元</tspan></text><line x1="520" y1="246" x2="520" y2="714" stroke="#5b6270" stroke-width="2"/><text x="70" y="318.5" font-size="28" font-weight="400" fill="#1a1d24" text-anchor="start"><tspan x="70" dy="0">自然搜索</tspan></text><rect x="520" y="293.5" width="555" height="32" fill="#2757d6"/><rect x="1100" y="304.5" width="10" height="10" fill="#2757d