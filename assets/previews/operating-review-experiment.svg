<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="240" viewBox="0 0 1600 240" font-family="Noto Sans SC, sans-serif"><rect x="0" y="0" width="1600" height="240" fill="#FFFFFF"/><g id="workflow-step-1"><rect x="40" y="12" width="362" height="168" fill="#EAF0FF"/><rect x="106" y="22" width="64" height="3" fill="#2454CE"/><circle cx="68" cy="48" r="20" fill="#FFFFFF" stroke="#2454CE" stroke-width="2"/><text x="68" y="57" text-anchor="middle" font-size="26" font-weight="600" fill="#2454CE">1</text><text x="106.0" y="58" font-size="32" font-weight="600" fill="#202B3D"><tspan x="106.0" dy="0">拆分渠道</tspan></text><text x="48.0" y="112" font-size="28" font-weight="400" fill="#202B3D"><tspan x="48.0" dy="0">按来源和首购月份建立客</tspan><tspan x="48.0" dy="36">户批次。</tspan></text></g><line x1="404" y1="48" x2="422" y2="48" stroke="#2454CE" stroke-width="2"/><polyline points="416,42 422,48 416,54" fill="none" stroke="#2454CE" stroke-width="2"/><g id="workflow-step-2"><rect x="426" y="12" width="362" height="168" fill="#FFEFD9"/><rect x="492" y="22" width="64" height="3" fill="#B4480B"/><circle cx="454" cy="48" r="20" fill="#FFFFFF" stroke="#B4480B" stroke-width="2"/><text x="454" y="57" text-anchor="middle" font-size="26" font-weight="600" fill="#B4480B">2</text><text x="492.0" y="58" font-size="32" font-weight="600" fill="#202B3D"><tspan x="492.0" dy="0">补齐成本</tspan></text><text x="434.0" y="112" font-size="28" font-weight="400" fill="#202B3D"><tspan x="434.0" dy="0">纳入投放、人力和优</tspan><tspan x="434.0" dy="36">惠成本。</tspan></text></g><line x1="790" y1="48" x2="808" y2="48" stroke="#B4480B" stroke-width="2"/><polyline points="802,42 808,48 802,54" fill="none" stroke="#B4480B" stroke-width="2"/><g id="workflow-step-3"><rect x="812" y="12" width="362" height="168" fill="#E3F5EE"/><rect x="878" y="22" width="64" height="3" fill="#08756A"/><circle cx="840" cy="48" r="20" fill="#FFFFFF" stroke="#08756A" stroke-width="2"/><text x="840" y="57" text-anchor="middle" font-size="26" font-weight="600" fill="#08756A">3</text><text x="878.0" y="58" font-size="32" font-weight="600" fill="#202B3D"><tspan x="878.0" dy="0">观察质量</tspan></text><text x="820.0" y="112" font-size="28" font-weight="400" fill="#202B3D"><tspan x="820.0" dy="0">比较首月使用、退款与后</tspan><tspan x="820.0" dy="36">续续费。</tspan></text></g><line x1="1176" y1="48" x2="1194" y2="48" stroke="#08756A" stroke-width="2"/><polyline points="1188,42 1194,48 1188,54" fill="none" stroke="#08756A" stroke-width="2"/><g id="workflow-step-4"><rect x="1198" y="12" width="362" height="168" fill="#F1E8FC"/><rect x="1264" y="22" width="64" height="3" fill="#7143AD"/><circle cx="1226" cy="48" r="20" fill="#FFFFFF" stroke="#7143AD" stroke-width="2"/><text x="1226" y="57" text-anchor="middle" font-size="26" font-weight="600" fill="#7143AD">4</text><text x="1264.0" y="58" font-size="32" font-weight="600" fill="#202B3D"><tspan x="1264.0" dy="0">调整资源</tspan></text><text x="1206.0" y="112" font-size="28" font-weight="400" fill="#202B3D"><tspan x="1206.0" dy="0">依据完整证据提出下季度渠</tspan><tspan x="1206.0" dy="36">道方案。</tspan></text></g></svg>
